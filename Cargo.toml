[package]
name = "stage_divetoheart"
version = "2.0.0"
authors = ["ThatNintendoNerd"]
edition = "2024"

[package.metadata.skyline]
titleid = "01006A800016E000"

[lib]
crate-type = ["cdylib"]

[dependencies]
libc2 = { git = "https://github.com/ultimate-research/libc2-rs.git", features = ["impl"] }
memchr = "2.8.3"
ninput = { git = "https://github.com/blu-dev/ninput.git" }
parking_lot = "0.12.5"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
skyline = "0.6.0"
toml = "1.1.8"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
